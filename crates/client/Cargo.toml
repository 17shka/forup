[package]
name = "client"
version.workspace = true
edition.workspace = true

[package.metadata.leptos-i18n]
default = "en"
locales-dir = "locales"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

hydrate = [
    "leptos/hydrate",
    "thaw/hydrate",
    "leptos_i18n/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:gloo-net",
    "dep:postcard",
    "dep:serde",
]

csr = [
    "leptos/csr",
    "thaw/csr",
    "leptos_i18n/csr",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:gloo-net",
    "dep:postcard",
    "dep:serde",
]

ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "thaw/ssr",
    "leptos_i18n/axum",
    "leptos-use/ssr",
    "leptos-use/axum",
]

[dependencies]
forup-core.workspace = true
codee = "0.3.5"
console_error_panic_hook = { version = "0.1.7", optional = true }
gloo-net = { version = "0.8.0", optional = true }
leptos.workspace = true
leptos_meta = "0.8"
leptos_router = { version = "0.8.17" }
leptos-use = "0.20.0"
leptos_i18n = { version = "0.6.3", default-features = false }
postcard = { workspace = true, optional = true } # room serialization
serde = { workspace = true, optional = true } # models
thaw = { version = "0.5.0-beta", default-features = false }
wasm-bindgen = { version = "=0.2.129", optional = true }

[build-dependencies]
leptos_i18n_build = "0.6.3"
