[package]
name = "client"
version.workspace = true
edition.workspace = true

[package.metadata.leptos-i18n]
default = "en"
locales-dir = "locales"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

hydrate = [
    "leptos/hydrate",
    "thaw/hydrate",
    "leptos_i18n/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]

csr = [
    "leptos/csr",
    "thaw/csr",
    "leptos_i18n/csr",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]

ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "thaw/ssr",
    "leptos_i18n/axum",
    "leptos-use/ssr",
    "leptos-use/axum",
]

[dependencies]
forup-core.workspace = true
glam.workspace = true
codee = "0.3.5"
console_error_panic_hook = { version = "0.1.7", optional = true }
leptos = { version = "0.8.23", default-features = false }
leptos_meta = "0.8"
leptos_router = { version = "0.8.17" }
leptos-use = "0.20.0"
leptos_i18n = { version = "0.6.2", default-features = false }
# thaw 0.4.x targets Leptos 0.7; 0.5.0-beta is the Leptos 0.8-compatible release.
thaw = { version = "0.5.0-beta", default-features = false }
wasm-bindgen = { version = "=0.2.129", optional = true }

[build-dependencies]
leptos_i18n_build = "0.6.2"
