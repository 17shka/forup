[package]
name = "forup-core"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] } # models
postcard = { version = "1.1.3", features = ["alloc"] } # history serialization
redb = { version = "4.5.0" } # history storage
chrono = { version = "0.4.45", default-features = false, features = ["std"] } # dates in profiles
indexmap = { version = "2.14.2", features = ["serde"] } # ordered map for character turn order

# The account store only exists on the server; target-gating these keeps OS
# randomness and password hashing out of the wasm bundle.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4.3" # OS randomness for salts and session tokens
sha2 = "0.11.1" # password hashing
hex = "0.4.3" # readable hashes and tokens
