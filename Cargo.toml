[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GNU"
repository = "https://github.com/17shka/forup"

[workspace.dependencies]
forup-core = { path = "crates/core" }

[[workspace.metadata.leptos]]
name = "forup"
bin-package = "server"
bin-target = "server"
lib-package = "client"
output-name = "forup"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/client/style.css"
# site-addr = "127.0.0.1:3000"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
