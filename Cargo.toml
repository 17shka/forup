[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/server",
    "crates/client/leptos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GNU"

[workspace.dependencies]
forup-core = { path = "crates/core" }
glam = { version = "0.34.3", features = ["serde"] } # math

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
